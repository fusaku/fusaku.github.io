<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="playerTitle">视频播放 - 字幕播放器</title>
  <link rel="stylesheet" href="css/styles.css?v=20260926_01">
  <link rel="stylesheet" href="css/summary.css?v=20260926_01">
  <script src="js/theme.js?v=20260926_01"></script>
</head>

<body class="player-page" style="height: 100vh; display: flex; flex-direction: column;">

  <div id="header">
    <a href="index.html" id="back-button" data-i18n="player.backToList">← 返回</a>
    <h1 id="video-title">加载中...</h1>
    <div id="subtitle-controls">
      <span id="subtitle-status"><span data-i18n="subtitles.status">字幕</span>: <span
          data-i18n="subtitles.loading">加载中...</span></span>
      <button id="subtitle-toggle" class="disabled" data-i18n="subtitles.show">显示字幕</button>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="切换主题" title="切换暗色/浅色模式">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="video-container">
    <div class="video-wrapper">
      <div id="loading">
        <div class="loading-spinner"></div>
        <span data-i18n="loading.loadingVideo">正在加载视频...</span><br><br>
        <small id="loading-status" data-i18n="loading.initPlayer">初始化播放器</small>
      </div>

      <div id="error" class="hidden">
        <h3 data-i18n="error.loadFailed">加载失败</h3>
        <p id="error-message" data-i18n="error.cannotLoadVideo">无法加载视频</p>
        <button onclick="retryLoad()" class="btn btn-primary" data-i18n="player.retry">重试</button>
      </div>

      <div id="youtube-player" class="hidden"></div>
      <iframe id="fallback-iframe" class="hidden" allowfullscreen></iframe>

      <div id="subtitle-overlay"></div>
    </div>
  </div>
  <!-- AI总结功能 -->
  <div id="video-actions">
    <button id="summary-button">
      <div class="button-left">
        <span class="icon">📝</span>
        <span class="text" data-i18n="summary.button">AI总结</span>
      </div>
      <span class="arrow">▼</span>
    </button>
    <div id="summary-content">
      <div class="content-inner"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/youtube-player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/main.js"></script>
  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
    data-cf-beacon='{"token": "d4fe6009f81743d7a64c418b9094caea"}'></script>
  <!-- End Cloudflare Web Analytics -->
  <!-- 引入 Markdown 解析库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>

</html>
